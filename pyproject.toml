[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-utils"
# 2.0.0: vessel_utils lost seven of its twelve modules (storage, chunked,
# correct, qc, validate, ensemble, sweep) and three dependencies. A major bump
# so an installed 1.0.0 and this are told apart by their version rather than by
# a ModuleNotFoundError.
version = "2.0.0"
description = "Blood vessel segmentation for mouse brain microscopy: the published pipeline, frozen, plus active development"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "itk",
    "matplotlib",
    "numpy",
    "opencv-python",
    "scikit-image",
    "scipy",
    "SimpleITK",
    "tifffile",
]

[project.optional-dependencies]
# Everything needed to run the tests AND the analysis notebooks/scripts, so that
# `pip install -e ".[dev]"` into a fresh venv gives a complete environment.
dev = [
    "pytest",
    "pandas",       # the analysis notebooks
    "jupyterlab",   # run the notebooks
    "nbconvert",    # execute notebooks headlessly
    "nbclient",
    "ipykernel",
    "tqdm",         # the archive notebooks' batch loops; no .py imports it
]

[tool.setuptools]
packages = ["velazquez_rivera_2025", "vessel_utils", "vessel_utils._vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
