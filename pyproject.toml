[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-utils"
version = "1.0.0"
description = "Blood vessel segmentation for mouse brain microscopy: the published pipeline, frozen, plus active development"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "itk",
    "matplotlib",
    "numpy",
    "opencv-python",
    "scikit-image",
    "scipy",
    "SimpleITK",
    "zarr",
    "dask",
    "tifffile",
    "PyWavelets",
    "tqdm",
]

[project.optional-dependencies]
# Everything needed to run the tests AND the analysis notebooks/scripts, so that
# `pip install -e ".[dev]"` into a fresh venv gives a complete environment.
dev = [
    "pytest",
    "pandas",       # the analysis notebooks
    "jupyterlab",   # run the notebooks
    "nbconvert",    # execute notebooks headlessly
    "nbclient",
    "ipykernel",
]

[tool.setuptools]
# The published archive now lives under archive/velazquez_rivera_2025 as
# reference code (imported in tests via the repo root, verified frozen by
# tests/test_archive_frozen.py); it is no longer a shipped package.
packages = ["vessel_utils", "vessel_utils._vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
