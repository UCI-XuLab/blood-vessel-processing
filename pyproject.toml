[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-utils"
version = "1.0.0"
description = "Shared helpers for the blood vessel processing notebooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "itk",
    "matplotlib",
    "numpy",
    "opencv-python",
    "scikit-image",
    "scipy",
    "SimpleITK",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vessel_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
